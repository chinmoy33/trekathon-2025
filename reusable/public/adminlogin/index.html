<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGIN</title>
    <link rel="stylesheet" href="./styles.css"></link>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <div class="form-container">
        <h1>ADMIN LOGIN</h1>
        <form action="/api/v1/project/admin/login" method="post">
            <div class="form-div"> 
                <label for="username">username</label><br>
                <input name="username" type="text" placeholder="enter your name"></input>
            </div>
            <div class="form-div">
                <label for="password">password</label><br>
                <input name="password" type="password" placeholder="enter your password"></input>
            </div>
            <button class="submit-button" type="submit">Login</button>
        </form>
        <div class="result"></div>
        <p>Dont have an account? <a href="/api/v1/project/admin/signup">Signup</a></p>
    </div>
</body>
</html>
