    <!-- Modal for Adding Package -->
    <div class="modal fade" id="addPackageModal" tabindex="-1" aria-labelledby="addPackageModalLabel" inert>
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="addPackageModalLabel">Add New Package</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addPackageForm">
              <div class="mb-3">
                <label for="packageImage" class="form-label">Upload Image</label>
                <input type="file" class="form-control" id="packageImage" accept="image/*" required>
              </div>
              <div class="mb-3">
                <label for="packageTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="packageTitle" placeholder="Enter title" required>
              </div>
              <div class="mb-3">
                <label for="packageDuration" class="form-label">Number of nights</label>
                <input type="number" class="form-control" id="packageDuration" min="1" max="100"  step="1" required>
              </div>
              <div class="mb-3">
                <label for="packagePrice" class="form-label">Package Price</label>
                <input type="number" class="form-control" id="packagePrice" placeholder="Enter price" required>
              </div>
              <div class="mb-3">
                <label for="packageText" class="form-label">Description</label>
                <textarea class="form-control" id="packageText" rows="3" placeholder="Enter description" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Add Package</button>
            </form>
          </div>
        </div>
      </div>
    </div>
    
    <!-- Modal for adding homestay -->

            <h5 class="modal-title" id="addhomestayModalLabel">Add New Homestay</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <form id="addhomestayForm">
              <div class="mb-3">
                <label for="homestayImage" class="form-label">Upload Image</label>
                <input type="file" class="form-control" id="homestayImage" accept="image/*" required>
              </div>
              <div class="mb-3">
                <label for="homestayTitle" class="form-label">Title</label>
                <input type="text" class="form-control" id="homestayTitle" placeholder="Enter title" required>
              </div>
              <div class="mb-3">
                <label for="homestayDuration" class="form-label">Number of nights</label>
                <input type="number" class="form-control" id="homestayDuration" min="1" max="100"  step="1" required>
              </div>
              <div class="mb-3">
                <label for="homestayPrice" class="form-label">Homestay Price per night</label>
                <input type="number" class="form-control" id="homestayPrice" placeholder="Enter price" required>
              </div>
              <div class="mb-3">
                <label for="homestayText" class="form-label">Description</label>
                <textarea class="form-control" id="homestayText" rows="3" placeholder="Enter description" required></textarea>
              </div>
              <button type="submit" class="btn btn-primary">Add Homestay</button>
            </form>
          </div>
        </div>
      </div>
